<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <link rel="stylesheet" href="public/css/form_render.css">
</head>

<body>

<form
    action="https://teach-backend-fawn.vercel.app/api/product"
    method="POST"
    enctype="multipart/form-data">

    <fieldset>
        <legend>General Info</legend>
        <div class="form-group">
            <label for="itemName">Item Name</label>
            <input
                type="text"
                id="itemName"
                name="itemName"
                required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="itemDescription"
                rows="6"></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>

            <select id="category" name="category">
                <option value="notSpecified">notSpecified</option>
                <option value="consumption">consumption</option>
                <option value="household">household</option>
                <option value="electronic">electronic</option>
                <option value="gadget">gadget</option>
            </select>
        </div>

    </fieldset>

    <fieldset>

        <legend>Misc.</legend>

        <div class="form-group">
            <label for="inventoryAmount">Inventory Amount</label>

            <input
                type="number"
                id="inventoryAmount"
                name="inventoryAmount">
        </div>

        <div class="form-group">
            <label for="listPrice">List Price</label>

            <input
                type="number"
                id="listPrice"
                name="listPrice">
        </div>

        <div class="form-group">
            <label>Available Stores</label>

            <div class="inline">
                <label><input type="checkbox" name="availableStore[]" value="Bangkok"> Bangkok</label>

                <label><input type="checkbox" name="availableStore[]" value="Pattaya"> Pattaya</label>

                <label><input type="checkbox" name="availableStore[]" value="Phuket"> Phuket</label>
            </div>
        </div>

        <div class="form-group">
            <label>Available Stores</label>

            <div class="inline">
                <label>
                    <input
                        type="radio"
                        id="active"
                        name="status"
                        value="Active">
                    Active
                </label>

                <label>
                    <input
                        type="radio"
                        id="inactive"
                        name="status"
                        value="Inactive">
                    Inactive
                </label>
            </div>
        </div>

    </fieldset>

    <fieldset>

        <legend>Staff</legend>

        <div class="form-group">
            <label for="staffEmail">Staff Email</label>

            <input
                type="email"
                id="staffEmail"
                name="staffEmail"
                required>
        </div>

    </fieldset>

    <div class="submit-area">
        <button type="submit">Submit Form</button>
    </div>

</form>

</body>
</html>
